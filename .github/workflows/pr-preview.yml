name: PR Preview (Vercel)

# Deploys the docs/ site (hhtdiary.org) to a Vercel preview URL for each PR.
# Production stays on GitHub Pages; Vercel is only used for previews.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "vercel.json"
      - ".github/workflows/pr-preview.yml"

# One preview per PR; a new push cancels the in-flight deploy.
concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Secrets are not exposed to PRs opened from forks, so skip those.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --archive=tgz \
            --token="$VERCEL_TOKEN" \
            --meta "githubPrNumber=$PR_NUMBER" \
            --meta "githubCommitSha=$SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-pr-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const pages = [
              ['Docs home', '/index.html'],
              ['Project story (backup)', '/backup/index.html'],
              ['Installation', '/installation.html'],
              ['Using the app', '/using-the-app.html'],
              ['Privacy', '/privacy.html'],
            ];
            const list = pages
              .map(([name, path]) => `- [${name}](${url}${path})`)
              .join('\n');
            const body = [
              marker,
              '### 🔍 Preview deployment',
              '',
              `**${url}**`,
              '',
              list,
              '',
              `<sub>Commit \`${sha}\` · updated ${new Date().toISOString()}</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
