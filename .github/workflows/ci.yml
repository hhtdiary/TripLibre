name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (docs JS/CSS/HTML + a11y, Markdown, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint, Stylelint, html-validate (incl. a11y rules), markdownlint
        run: npm run lint
      - name: Ruff (analysis/)
        run: pipx run ruff==0.15.1 check

  a11y:
    name: Docs accessibility (axe-core, WCAG 2.1 AA, light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: axe-core on every docs page
        run: npm run a11y

  core:
    name: Core tests + export contract
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Python deps
        run: pip install pandas numpy matplotlib
      - name: Swift tests (inference fixtures, edits, reprocessing, export, analytics)
        run: make test
      - name: Export → Python contract check
        run: make export-check
      - name: Calibration harness smoke test (synthetic data only)
        run: make calibrate-smoke

  app:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Project is in sync with project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- HHT.xcodeproj/project.pbxproj || {
            echo "::error::HHT.xcodeproj is out of date. Run 'make project' and commit it."; exit 1; }
      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HHT.xcodeproj -scheme HHT \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-xcode CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Build for device (unsigned, catches simulator-only code leaking)
        run: |
          set -o pipefail
          xcodebuild -project HHT.xcodeproj -scheme HHT \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build-xcode CODE_SIGNING_ALLOWED=NO build | tail -20
