name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (docs JS/CSS/HTML + a11y, Markdown, Python, Swift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint, Stylelint, html-validate (incl. a11y rules), markdownlint
        run: npm run lint
      - name: Ruff (analysis/)
        run: pipx run ruff==0.15.1 check
      # Static Linux builds, pinned and checksummed; no macOS runner needed. Bump together with the Makefile pins.
      - name: Install SwiftLint 0.65.1 + SwiftFormat 0.63.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          curl -fsSLO https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat_linux.zip
          sha256sum -c - <<'SUMS'
          caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  swiftlint_linux_amd64.zip
          9e10090e0213378c68cedb42adc2c6461916a9c8e457cf452b5585b84096c333  swiftformat_linux.zip
          SUMS
          unzip -q swiftlint_linux_amd64.zip swiftlint-static && unzip -q swiftformat_linux.zip
          # A runner-owned bin dir, so this doesn't depend on /usr/local/bin being writable.
          mkdir -p bin
          install -m 755 swiftlint-static bin/swiftlint
          install -m 755 swiftformat_linux bin/swiftformat
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SwiftLint (new violations only; see .swiftlint-baseline.json)
        run: swiftlint lint --strict --quiet --baseline .swiftlint-baseline.json --reporter github-actions-logging
      - name: SwiftFormat (check only; see .swiftformat)
        run: swiftformat --lint . --reporter github-actions-log

  a11y:
    name: Docs accessibility (axe-core, WCAG 2.1 AA, light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: axe-core on every docs page
        run: npm run a11y

  core:
    name: Core tests + export contract
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Python deps
        run: pip install pandas numpy matplotlib
      - name: Swift tests (inference fixtures, edits, reprocessing, export, analytics)
        run: make test
      - name: Export → Python contract check
        run: make export-check
      - name: Calibration harness smoke test (synthetic data only)
        run: make calibrate-smoke

  app:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Project is in sync with project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- HHT.xcodeproj/project.pbxproj || {
            echo "::error::HHT.xcodeproj is out of date. Run 'make project' and commit it."; exit 1; }
      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HHT.xcodeproj -scheme HHT \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-xcode CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Build for device (unsigned, catches simulator-only code leaking)
        run: |
          set -o pipefail
          xcodebuild -project HHT.xcodeproj -scheme HHT \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build-xcode CODE_SIGNING_ALLOWED=NO build | tail -20

  ui-test:
    name: UI tests + accessibility audits (simulator)
    # macos-26 has the newest Xcode and iOS simulator GitHub offers (Xcode 26.6 / iOS 26.5 as of Oct 2026);
    # macos-15 tops out at Xcode 26.3 / iOS 26.2.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      # iPhone 17 on the newest iOS runtime (what the audits were tuned on); else the newest iPhone on that runtime.
      - name: Pick and boot a simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          sim=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))
              | {v: (.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber)),
                 d: (.value | map(select(.name | startswith("iPhone"))))}
              | select(.d | length > 0)]
            | max_by(.v) | .d
            | ((map(select(.name == "iPhone 17")) + [last]) | first) | "\(.udid) \(.name)"')
          [ -n "$sim" ] && [ "$sim" != "null null" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "Using simulator: $sim"
          echo "SIM_ID=${sim%% *}" >> "$GITHUB_ENV"
          xcrun simctl boot "${sim%% *}" || true
          xcrun simctl bootstatus "${sim%% *}" -b
      - name: make ui-test
        # failures also print a screenshot to the log (see HHTUITestCase.logScreenshot)
        env:
          TEST_RUNNER_HHT_LOG_SCREENSHOTS: "1"
        run: make ui-test SIM_ID="$SIM_ID" RESULT_BUNDLE=.build-xcode/ui-tests.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: .build-xcode/ui-tests.xcresult
          retention-days: 7
