# Generate the Xcode project with:  xcodegen generate
name: HHT
options:
  bundleIdPrefix: com.zyang91
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple ID team here (Xcode › Settings › Accounts), or pick it in Signing & Capabilities.
    DEVELOPMENT_TEAM: 8HRS3Q2SF3
    CODE_SIGN_STYLE: Automatic
packages:
  HHTCore:
    path: Packages/HHTCore
targets:
  HHT:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HHTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyang91.hht
        PRODUCT_NAME: HHT
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: HHT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: HHT
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "HHT records where you go to build your private travel diary. Data never leaves your iPhone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow “Always” so HHT can log trips in the background. GPS is used only while you are moving; data stays on your iPhone."
        NSMotionUsageDescription: "Motion activity (walking, cycling, in a vehicle) helps HHT tell travel modes apart. It stays on your iPhone."
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.zyang91.hht.refresh]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
