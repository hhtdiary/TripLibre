# Generate the Xcode project with:  xcodegen generate
name: HHT
options:
  bundleIdPrefix: com.zyang91
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple ID team here (Xcode › Settings › Accounts), or pick it in Signing & Capabilities.
    DEVELOPMENT_TEAM: 8HRS3Q2SF3
    CODE_SIGN_STYLE: Automatic
packages:
  HHTCore:
    path: Packages/HHTCore
targets:
  HHT:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HHTCore
      - target: HHTWidgets
    scheme:
      testTargets: [HHTUITests]
    entitlements:
      path: App/Support/HHT.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zyang91.hht]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyang91.hht
        PRODUCT_NAME: HHT
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: TripLibre
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: TripLibre
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keep these in line with release/app-privacy-details.md: no absolute "never leaves" claims, since optional
        # address lookup and map tiles go to Apple (#41).
        NSLocationWhenInUseUsageDescription: "TripLibre uses your location to build your travel diary of visits and trips. Your diary is saved only on this iPhone; TripLibre has no account or server."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow “Always” so TripLibre can log trips while it’s in the background. GPS runs only while you’re moving, and your diary is saved only on this iPhone."
        NSMotionUsageDescription: "Motion activity (walking, cycling, in a vehicle) helps TripLibre tell travel modes apart. It’s used only on this iPhone."
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.zyang91.hht.refresh]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # widget taps open hht://today, hht://stats, hht://settings
        CFBundleURLTypes:
          - CFBundleURLName: com.zyang91.hht
            CFBundleURLSchemes: [hht]
  # XCUITest flows + accessibility audits (issue #64). `make ui-test`; see docs/accessibility-testing.md.
  HHTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HHT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyang91.hht.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  # Read-only Home Screen widgets (issue #47). They read the snapshot the app writes into the App Group.
  HHTWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Support/Theme.swift
    dependencies:
      - package: HHTCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/HHTWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zyang91.hht]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyang91.hht.widgets
        PRODUCT_NAME: HHTWidgets
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TripLibre
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
